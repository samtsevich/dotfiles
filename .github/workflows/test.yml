name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck lua5.4
          pip install tomli

      - name: Run dotfiles test suite
        run: |
          chmod +x tests/test.sh
          ./tests/test.sh
